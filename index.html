<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DayVoice - AI Day Planner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=DM+Sans:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#f8f8f6;color:#1a1a1a;padding:1.5rem;min-height:100vh;}
h1,h2,h3{font-family:'Syne',sans-serif;}
.app-header{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem;}
.app-logo{width:40px;height:40px;background:#1D9E75;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.app-title{font-size:22px;font-weight:700;}
.app-subtitle{font-size:13px;color:#666;margin-top:2px;}
.tabs{display:flex;gap:4px;margin-bottom:1.5rem;background:#efefef;padding:4px;border-radius:10px;}
.tab{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:500;border-radius:8px;cursor:pointer;border:none;background:transparent;color:#666;font-family:'DM Sans',sans-serif;transition:all 0.2s;}
.tab.active{background:#fff;color:#1a1a1a;border:0.5px solid #ddd;}
.page{display:none;}
.page.active{display:block;}
.voice-section{background:#fff;border:0.5px solid #e0e0e0;border-radius:16px;padding:1.5rem;margin-bottom:1.5rem;}
.voice-label{font-size:11px;color:#888;margin-bottom:1rem;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;}
.input-row{display:flex;gap:10px;align-items:flex-end;}
.task-textarea{flex:1;background:#f5f5f5;border:0.5px solid #ddd;border-radius:10px;padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:14px;color:#1a1a1a;resize:none;min-height:80px;outline:none;line-height:1.6;}
.task-textarea::placeholder{color:#aaa;}
.task-textarea:focus{border-color:#1D9E75;}
.btn-mic{width:48px;height:48px;border-radius:50%;border:0.5px solid #ddd;background:#f5f5f5;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;}
.btn-mic:hover{background:#E1F5EE;border-color:#1D9E75;}
.btn-mic.recording{background:#FCEBEB;border-color:#E24B4A;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.btn-plan{width:100%;margin-top:1rem;padding:12px;background:#1D9E75;color:white;border:none;border-radius:10px;font-family:'Syne',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-plan:hover{background:#0F6E56;}
.btn-plan:disabled{background:#eee;color:#aaa;cursor:not-allowed;}
.loading-bar{height:3px;background:#eee;border-radius:99px;overflow:hidden;margin-top:0.75rem;display:none;}
.loading-bar.active{display:block;}
.loading-fill{height:100%;background:#1D9E75;border-radius:99px;animation:loadingAnim 1.8s ease-in-out infinite;}
@keyframes loadingAnim{0%{width:0%;margin-left:0;}50%{width:60%;margin-left:20%;}100%{width:0%;margin-left:100%;}}
.section-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:500;margin-bottom:1rem;display:flex;align-items:center;gap:8px;}
.date-badge{font-size:11px;background:#f5f5f5;color:#666;padding:3px 10px;border-radius:99px;border:0.5px solid #e0e0e0;font-family:'DM Sans',sans-serif;font-weight:400;}
.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem;}
.stat-card{background:#f5f5f5;border-radius:10px;padding:0.75rem 1rem;text-align:center;}
.stat-val{font-size:20px;font-weight:500;font-family:'Syne',sans-serif;}
.stat-lbl{font-size:11px;color:#888;margin-top:2px;}
.timeline{position:relative;padding-left:24px;}
.timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:#e0e0e0;}
.task-card{background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:10px;position:relative;}
.task-dot{width:14px;height:14px;border-radius:50%;position:absolute;left:-21px;top:50%;transform:translateY(-50%);border:2px solid #f8f8f6;}
.priority-high .task-dot{background:#E24B4A;}
.priority-medium .task-dot{background:#EF9F27;}
.priority-low .task-dot{background:#1D9E75;}
.task-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;}
.task-name{font-size:14px;font-weight:500;line-height:1.4;flex:1;}
.priority-badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;white-space:nowrap;flex-shrink:0;}
.badge-high{background:#FCEBEB;color:#A32D2D;}
.badge-medium{background:#FAEEDA;color:#854F0B;}
.badge-low{background:#E1F5EE;color:#0F6E56;}
.task-meta{display:flex;gap:12px;font-size:12px;color:#888;}
.task-reason{font-size:12px;color:#888;margin-top:6px;padding-top:6px;border-top:0.5px solid #eee;line-height:1.5;font-style:italic;}
.notify-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:0.5px solid #ddd;background:transparent;font-size:13px;color:#666;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s;margin-top:1rem;}
.notify-btn:hover,.notify-btn.enabled{background:#E1F5EE;color:#0F6E56;border-color:#1D9E75;}
.reset-btn{font-size:12px;color:#888;background:none;border:none;cursor:pointer;text-decoration:underline;font-family:'DM Sans',sans-serif;margin-top:1rem;display:block;}
.error-msg{font-size:13px;color:#A32D2D;background:#FCEBEB;border-radius:8px;padding:10px 14px;margin-top:0.75rem;display:none;}
.error-msg.visible{display:block;}
.mic-hint{font-size:12px;color:#aaa;margin-top:8px;text-align:center;}
.history-empty{text-align:center;padding:3rem 1rem;color:#888;font-size:14px;}
.history-card{background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:10px;cursor:pointer;transition:border-color 0.2s;}
.history-card:hover{border-color:#1D9E75;}
.history-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.history-date{font-size:14px;font-weight:500;}
.history-meta{font-size:12px;color:#888;}
.history-tasks{font-size:12px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.history-delete{font-size:11px;color:#A32D2D;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;padding:2px 6px;border-radius:4px;}
.history-delete:hover{background:#FCEBEB;}
.back-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:#888;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;margin-bottom:1rem;padding:0;}
.back-btn:hover{color:#1a1a1a;}
.tip-box{font-size:13px;color:#888;padding:12px 16px;background:#f5f5f5;border-radius:10px;margin-top:1rem;font-style:italic;}
</style>
</head>
<body>
<div class="app-header">
  <div class="app-logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2C10.3 2 9 3.3 9 5v6c0 1.7 1.3 3 3 3s3-1.3 3-3V5c0-1.7-1.3-3-3-3z" fill="white"/><path d="M19 11c0 3.9-3.1 7-7 7s-7-3.1-7-7H3c0 4.9 3.7 8.9 8.5 9.4V22h1v-1.6C18.3 19.9 22 15.9 22 11h-3z" fill="white"/></svg>
  </div>
  <div>
    <div class="app-title">DayVoice</div>
    <div class="app-subtitle">Speak your tasks, AI plans your day</div>
  </div>
</div>
<div class="tabs">
  <button class="tab active" onclick="switchTab('plan')">Plan Today</button>
  <button class="tab" onclick="switchTab('history')">History</button>
</div>
<div class="page active" id="page-plan">
  <div class="voice-section">
    <div class="voice-label">What do you need to do today?</div>
    <div class="input-row">
      <textarea class="task-textarea" id="taskInput" placeholder="e.g. Study maths 2 hours high priority, go to gym medium, call client at 4pm urgent..."></textarea>
      <button class="btn-mic" id="micBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2C10.3 2 9 3.3 9 5v6c0 1.7 1.3 3 3 3s3-1.3 3-3V5c0-1.7-1.3-3-3-3z" fill="currentColor"/><path d="M19 11c0 3.9-3.1 7-7 7s-7-3.1-7-7H3c0 4.9 3.7 8.9 8.5 9.4V22h1v-1.6C18.3 19.9 22 15.9 22 11h-3z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="mic-hint" id="micHint">Tap mic to speak, or type your tasks above</div>
    <button class="btn-plan" id="planBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="white"/></svg>
      Plan My Day with AI
    </button>
    <div class="loading-bar" id="loadingBar"><div class="loading-fill"></div></div>
    <div class="error-msg" id="errorMsg"></div>
  </div>
  <div id="scheduleSection" style="display:none;">
    <div class="section-title">Your AI-Planned Schedule <span class="date-badge" id="dateBadge"></span></div>
    <div class="summary-row" id="summaryRow"></div>
    <div class="timeline" id="timeline"></div>
    <button class="notify-btn" id="notifyBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Enable notifications
    </button>
    <button class="reset-btn" id="resetBtn">Plan a new day</button>
  </div>
</div>
<div class="page" id="page-history">
  <div id="historyList"></div>
  <div id="historyDetail" style="display:none;">
    <button class="back-btn" onclick="showHistoryList()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Back to history
    </button>
    <div class="section-title" id="detailTitle"></div>
    <div class="summary-row" id="detailSummary"></div>
    <div class="timeline" id="detailTimeline"></div>
  </div>
</div>
<script>
const GEMINI_KEY='AIzaSyBVmGKanWTdda_P-9YFzIqmk-iA6jI05FQ';
const taskInput=document.getElementById('taskInput');
const planBtn=document.getElementById('planBtn');
const micBtn=document.getElementById('micBtn');
const micHint=document.getElementById('micHint');
const loadingBar=document.getElementById('loadingBar');
const errorMsg=document.getElementById('errorMsg');
const scheduleSection=document.getElementById('scheduleSection');
const timeline=document.getElementById('timeline');
const summaryRow=document.getElementById('summaryRow');
const dateBadge=document.getElementById('dateBadge');
const notifyBtn=document.getElementById('notifyBtn');
const resetBtn=document.getElementById('resetBtn');
let notificationsEnabled=false,scheduledNotifs=[];
dateBadge.textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'});
function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelector('[onclick="switchTab(\''+tab+'\')"]').classList.add('active');
  document.getElementById('page-'+tab).classList.add('active');
  if(tab==='history')renderHistoryList();
}
let recognition=null,isRecording=false;
if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();
  recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-IN';
  recognition.onstart=()=>{isRecording=true;micBtn.classList.add('recording');micHint.textContent='Listening... speak now';};
  recognition.onresult=(e)=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;taskInput.value=t;};
  recognition.onend=()=>{isRecording=false;micBtn.classList.remove('recording');micHint.textContent='Tap mic to speak, or type above';};
  recognition.onerror=()=>{isRecording=false;micBtn.classList.remove('recording');micHint.textContent='Mic error — try typing instead';};
}else{micHint.textContent='Voice not supported — please type';micBtn.style.opacity='0.4';micBtn.disabled=true;}
micBtn.addEventListener('click',()=>{if(!recognition)return;if(isRecording)recognition.stop();else{taskInput.value='';recognition.start();}});

async function callGemini(prompt){
  const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+GEMINI_KEY,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents:[{parts:[{text:prompt}]}],
      generationConfig:{temperature:0.7,maxOutputTokens:1500,responseMimeType:'application/json'}
    })
  });
  if(!res.ok){const e=await res.text();throw new Error('API error: '+res.status+' '+e);}
  const data=await res.json();
  const text=data.candidates?.[0]?.content?.parts?.[0]?.text;
  if(!text)throw new Error('Empty response from AI. Response: '+JSON.stringify(data));
  return text;
}

planBtn.addEventListener('click',async()=>{
  const input=taskInput.value.trim();
  if(!input){showError('Please tell me what tasks you have today!');return;}
  hideError();
  planBtn.disabled=true;
  planBtn.innerHTML='Planning...';
  loadingBar.classList.add('active');
  const currentHour=new Date().getHours();
  const prompt='You are a smart personal day planner. Plan the optimal day schedule for the user.\nCurrent time: '+currentHour+':00\nUser tasks: "'+input+'"\nRules:\n- Schedule high/urgent priority tasks first, or at their specified time\n- Add realistic time gaps between tasks\n- Keep tasks between 8am-10pm if no specific time given\n- Do not schedule past midnight\nReturn a JSON object with this exact structure:\n{"tasks":[{"name":"task name","time":"HH:MM","duration":60,"priority":"high","reason":"why scheduled at this time"}],"totalHours":5.5,"tip":"one motivational tip for the day"}';
  try{
    const text=await callGemini(prompt);
    let parsed;
    try{
      parsed=JSON.parse(text);
    }catch(e){
      const match=text.match(/\{[\s\S]*\}/);
      if(!match)throw new Error('Could not find JSON in response: '+text.substring(0,200));
      parsed=JSON.parse(match[0]);
    }
    if(!parsed.tasks||!Array.isArray(parsed.tasks))throw new Error('Invalid schedule format received');
    saveToHistory(input,parsed);
    renderSchedule(parsed);
  }catch(e){
    showError('AI error: '+e.message);
    console.error(e);
  }finally{
    planBtn.disabled=false;
    planBtn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="white"/></svg> Plan My Day with AI';
    loadingBar.classList.remove('active');
  }
});

function saveToHistory(input,data){
  const history=JSON.parse(localStorage.getItem('dayvoice_history')||'[]');
  history.unshift({id:Date.now(),date:new Date().toISOString(),input,data});
  if(history.length>30)history.pop();
  localStorage.setItem('dayvoice_history',JSON.stringify(history));
}

function renderSchedule(data,container){
  const tasks=data.tasks||[];
  const tl=container?document.getElementById('detailTimeline'):timeline;
  const sr=container?document.getElementById('detailSummary'):summaryRow;
  sr.innerHTML='<div class="stat-card"><div class="stat-val">'+tasks.length+'</div><div class="stat-lbl">Tasks</div></div><div class="stat-card"><div class="stat-val">'+Math.round(data.totalHours||0)+'h</div><div class="stat-lbl">Total time</div></div><div class="stat-card"><div class="stat-val">'+tasks.filter(t=>t.priority==='high').length+'</div><div class="stat-lbl">High priority</div></div>';
  tl.innerHTML='';
  tasks.forEach(task=>{
    const p=task.priority||'medium';
    const badgeClass=p==='high'?'badge-high':p==='medium'?'badge-medium':'badge-low';
    const label=p==='high'?'High':p==='medium'?'Medium':'Low';
    const dur=task.duration>=60?Math.round(task.duration/60)+'h':task.duration+'m';
    const card=document.createElement('div');
    card.className='task-card priority-'+p;
    card.innerHTML='<div class="task-dot"></div><div class="task-top"><div class="task-name">'+task.name+'</div><span class="priority-badge '+badgeClass+'">'+label+'</span></div><div class="task-meta"><span>'+task.time+'</span><span>'+dur+'</span></div>'+(task.reason?'<div class="task-reason">'+task.reason+'</div>':'');
    tl.appendChild(card);
  });
  if(data.tip){const tip=document.createElement('div');tip.className='tip-box';tip.textContent='✦ '+data.tip;tl.appendChild(tip);}
  if(!container){scheduleSection.style.display='block';scheduleSection.scrollIntoView({behavior:'smooth',block:'start'});if(notificationsEnabled)scheduleNotifications(tasks);}
}

function renderHistoryList(){
  const history=JSON.parse(localStorage.getItem('dayvoice_history')||'[]');
  const historyList=document.getElementById('historyList');
  document.getElementById('historyDetail').style.display='none';
  historyList.style.display='block';
  if(history.length===0){historyList.innerHTML='<div class="history-empty">No schedules yet.<br>Plan your first day!</div>';return;}
  historyList.innerHTML='<div class="section-title">Past Schedules</div>';
  history.forEach(item=>{
    const d=new Date(item.date);
    const dateStr=d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
    const taskNames=(item.data.tasks||[]).map(t=>t.name).join(', ');
    const card=document.createElement('div');
    card.className='history-card';
    card.innerHTML='<div class="history-card-top"><div class="history-date">'+dateStr+'</div><div style="display:flex;align-items:center;gap:8px;"><div class="history-meta">'+(item.data.tasks||[]).length+' tasks</div><button class="history-delete" onclick="deleteHistory(event,\''+item.id+'\')">Delete</button></div></div><div class="history-tasks">'+taskNames+'</div>';
    card.addEventListener('click',()=>showHistoryDetail(item));
    historyList.appendChild(card);
  });
}

function showHistoryDetail(item){
  document.getElementById('historyList').style.display='none';
  document.getElementById('historyDetail').style.display='block';
  const d=new Date(item.date);
  document.getElementById('detailTitle').innerHTML='Schedule — <span class="date-badge">'+d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'})+'</span>';
  renderSchedule(item.data,'detail');
}

function showHistoryList(){document.getElementById('historyDetail').style.display='none';document.getElementById('historyList').style.display='block';}
function deleteHistory(e,id){e.stopPropagation();const h=JSON.parse(localStorage.getItem('dayvoice_history')||'[]');localStorage.setItem('dayvoice_history',JSON.stringify(h.filter(x=>String(x.id)!==String(id))));renderHistoryList();}

notifyBtn.addEventListener('click',async()=>{
  if(!('Notification' in window)){alert('Notifications not supported in this browser.');return;}
  const perm=await Notification.requestPermission();
  if(perm==='granted'){notificationsEnabled=true;notifyBtn.classList.add('enabled');notifyBtn.innerHTML='Notifications enabled';new Notification('DayVoice',{body:'You will be notified 5 mins before each task!'});}
  else alert('Notifications blocked. Please enable in browser settings.');
});

function scheduleNotifications(tasks){
  scheduledNotifs.forEach(t=>clearTimeout(t));scheduledNotifs=[];
  const now=new Date();
  tasks.forEach(task=>{
    const[h,m]=task.time.split(':').map(Number);
    const taskTime=new Date();taskTime.setHours(h,m,0,0);
    const delay=taskTime.getTime()-5*60*1000-now.getTime();
    if(delay>0){const t=setTimeout(()=>new Notification('Starting soon: '+task.name,{body:'At '+task.time+' — get ready!'}),delay);scheduledNotifs.push(t);}
  });
}

resetBtn.addEventListener('click',()=>{taskInput.value='';scheduleSection.style.display='none';timeline.innerHTML='';summaryRow.innerHTML='';window.scrollTo({top:0,behavior:'smooth'});});
function showError(msg){errorMsg.textContent=msg;errorMsg.classList.add('visible');}
function hideError(){errorMsg.classList.remove('visible');}
</script>
</body>
</html>
